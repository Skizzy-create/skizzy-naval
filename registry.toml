# skizzy-naval module registry.
#
# One [[module]] entry per sub-mod. Adding a module = one folder under modules/<key>/ plus
# one entry here. Field reference and the release flow: RELEASING.md.
#
# Relationship lists (depends/recommends/suggests/supports/conflicts) accept:
#   "Identifier"         -> {"name": "Identifier"}
#   "@alias"             -> the entry from [aliases]
#   { name = ..., min_version = ... } or { any_of = [...] }  -> passed through as is
# CKAN identifiers were checked against the KSP-default CKAN repository on 2026-11-07.

[pack]
name = "Skizzy Naval"
release_repo = "Skizzy-create/skizzy-naval"
ckan_repo = "Skizzy-create/skizzy-ckan"
asset_prefix = "SkizzyNaval"          # release assets: SkizzyNaval-<key>-<version>.zip
spec_version = "v1.26"                # any_of needs v1.26
ksp_version_min = "1.12.0"
ksp_version_max = "1.12.99"

[aliases]
# BDArmory Plus 1.13.x from the main CKAN repo, or the Skizzy fork build when it ships.
bdarmory = { any_of = [
  { name = "BDArmoryForRunwayProject", min_version = "2:v1.13.0.0" },
  { name = "BDArmory-Skizzy" },
], choice_help_text = "BDArmory Plus 1.13 (BDArmoryForRunwayProject) or the Skizzy fork build (BDArmory-Skizzy)." }

[policy]
max_file_mb = 95
# Never ship shared third-party libraries; users get them from CKAN.
forbidden = [
  "ModuleManager*.dll",
  "Firespitter.dll", "*/Firespitter/*",
  "0Harmony.dll", "*/000_Harmony/*",
  "ClickThroughBlocker.dll", "ToolbarController.dll",
  "KSPCommunityFixes.dll", "B9PartSwitch.dll", "Scale.dll", "999_Scale_Redist.dll",
  "PhysicsRangeExtender.dll",
  "SMIndustries.dll",
]

