// 4b. AVLS11 / AVLS22 / AVLS33 (original part names): missile racks with working doors.
// BDA 1.13 opens a ModuleCargoBay's door animation before firing a missile that bay shields,
// but only if the door event reads "Open"/"Close". The cells stay racks with stock cargo-bay
// shielding; useBayContainer + the floor collider "Main" is used because the cell divider walls
// would otherwise block KSP's enclosure raycast.
// Module order on these parts: 0 ModuleColorChanger, 1 ModuleAnimateGeneric (AVLS) -> index 1.
@PART[AVLS11|AVLS22|AVLS33]:HAS[@MODULE[ModuleAnimateGeneric]:HAS[#animationName[AVLS]],!MODULE[ModuleCargoBay]]:AFTER[BDArmory]
{
	@MODULE[ModuleAnimateGeneric]:HAS[#animationName[AVLS]]
	{
		@startEventGUIName = Open
		@endEventGUIName = Close
		%actionGUIName = Toggle Cell Doors
	}
	MODULE
	{
		name = ModuleCargoBay
		DeployModuleIndex = 1
		closedPosition = 0
		lookupRadius = 5.8
		lookupCenter = 0, 4.6, 0
		useBayContainer = true
		bayContainerName = Main
		partTypeName = VLS cell
	}
}
// BDArmory only opens a bay for a missile whose "In Cargo Bay" flag is set. It sets the flag itself
// only when the weapon manager starts, which is before the stock cargo bay has worked out what it
// shields, so the flag usually stays false. ModuleMNWSBayLink sets it in flight for every missile
// shielded by this part's cargo bay (without the plugin: set "In Cargo Bay" on the missile by hand).
@PART[AVLS11|AVLS22|AVLS33]:HAS[@MODULE[ModuleCargoBay],!MODULE[ModuleMNWSBayLink]]:NEEDS[MNWSFix]:AFTER[BDArmory]
{
	MODULE
	{
		name = ModuleMNWSBayLink
		bayAnimations = AVLS
	}
}

// -------------------------------------------------------------------------------------
// 5. Missile and torpedo bays built into the hulls
// -------------------------------------------------------------------------------------
// The hulls carry missiles / torpedoes on attach nodes behind animated doors, but nothing told
// BDArmory about the doors, so it fired into closed doors. Two ways of linking them:
//
// Cargo bay: a stock ModuleCargoBay whose DeployModuleIndex is the door's ModuleAnimateGeneric
// (index in the part's original module list; the patches only ever append modules, or remove
// modules that come after these). The door events are renamed "Open"/"Close", which is what
// BDArmory checks before it toggles a bay door. useBayContainer points at a collider far away from
// the bay, which turns KSP's enclosure test into a plain lookup-sphere test (the hull's own
// colliders would otherwise block it); each sphere is sized to cover the bay's attach nodes and the
// parts hung on them (checked with baycheck.py against every MNWS missile). ModuleMNWSBayLink
// (plugin) sets "In Cargo Bay" on the shielded missiles and checks that each bay still points at
// its door.
//
// Action-group bay: one door animation that opens two separate side rooms (CGNX2050, CGX065
// torpedo doors). One sphere cannot cover both rooms without swallowing the deck between them,
// and two cargo bays on one animation make BDArmory close the door it has just opened (each bay
// closes "its" door when the current missile is not inside it). These doors get the default
// action group Custom08 (AG8), and ModuleMNWSBayLink sets BDArmory's "Custom Bay" = 8 on missiles
// inside the rooms, so BDArmory toggles AG8 (= the doors) before firing them. Without the plugin,
// set "Custom Bay" = 8 on those torpedoes by hand. Keep AG8 free of other actions on these hulls.

// SSBN002: SLBM tubes = module 5 (SSBN002DD, cargo bay); Torpedo room = module 6 (SSBN002TD, cargo bay)
@PART[SSBN002]:HAS[@MODULE[ModuleAnimateGeneric]:HAS[#animationName[SSBN002DD]],@MODULE[ModuleAnimateGeneric]:HAS[#animationName[SSBN002TD]],!MODULE[ModuleCargoBay]]:AFTER[BDArmory]
{
	@MODULE[ModuleAnimateGeneric]:HAS[#animationName[SSBN002DD]]
	{
		@startEventGUIName = Open
		@endEventGUIName = Close
		%actionGUIName = Toggle Missile Bay
	}
	@MODULE[ModuleAnimateGeneric]:HAS[#animationName[SSBN002TD]]
	{
		@startEventGUIName = Open
		@endEventGUIName = Close
		%actionGUIName = Toggle Torpedo Door
	}
	MODULE
	{
		name = ModuleCargoBay
		DeployModuleIndex = 5
		closedPosition = 0
		lookupRadius = 44.5
		lookupCenter = 0, 15, 0
		useBayContainer = true
		bayContainerName = Box003
	}
	MODULE
	{
		name = ModuleCargoBay
		DeployModuleIndex = 6
		closedPosition = 0
		lookupRadius = 10
		lookupCenter = 0, 76, 0
		useBayContainer = true
		bayContainerName = Box003
	}
}
@PART[SSBN002]:HAS[!MODULE[ModuleMNWSBayLink]]:NEEDS[MNWSFix]:AFTER[BDArmory]
{
	MODULE
	{
		name = ModuleMNWSBayLink
		bayAnimations = SSBN002DD, SSBN002TD
	}
