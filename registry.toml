conflicts = ["HullBreach"]
depends = ["ModuleManager", "@bdarmory"]
recommends = ["SkizzyNaval-LargeBoatPartsPack"]
suggests = ["KerbalPowersNaval", "StockalikeAircraftCarrierDecks", "SkizzyNaval-NAS"]
install = [{ file = "GameData/HullBreach", install_to = "GameData" }]
resources = { x_upstream = "https://github.com/gomker/HullBreach" }

