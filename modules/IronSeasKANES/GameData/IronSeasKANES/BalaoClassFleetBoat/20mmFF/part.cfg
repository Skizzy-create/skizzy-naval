PART:NEEDS[NAS,BDArmory]
{
// Kerbal Space Program - Part Config
// 
// 

// --- general parameters ---
name = 20MMAAGunBalaoClassFront
module = Part
author = SkunkWorks

// --- asset parameters ---
mesh = model.mu
rescaleFactor = 1

// --- node definitions ---
node_attach = 0.0, 0.0, 0.0, 0, -1, 0, 3
node_stack_bottom = 0.0, 0.0, 0.0, 0, 1, 0, 3

// --- editor parameters ---
TechRequired = precisionEngineering
entryCost = 2100
cost = 2000
category = Utility
subcategory = 0
title = 20 mm AA Gun Balao Class Forward Facing
manufacturer = #autoLOC_NAS_KerbinNavy_name //Kerbin Navy
description = Single 20 mm Oerlikon Mk 4 on a Mk 10 pedestal, the close-range AA gun on the Balao's bridge cigarette deck. 450 rpm from 60-round drums (8 s drum change). Fires NAS 20 mm AP (20mmAPLong); BDArmory 20x102Ammo stands in for the 20x110 mm round. Effective to about 1.5 km.
// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
attachRules = 1,1,0,0,0

// --- standard part parameters ---
mass = 0.01
dragModelType = default
maximum_drag = 0.2
minimum_drag = 0.2
angularDrag = 2
crashTolerance = 1250
maxTemp = 3400

breakingForce = 5000
breakingTorque = 5000
buoyancy = -1
tags = nas bdarmory balao submarine sub gun turret navy naval 20mm oerlikon anti aircraft aa us usn
stagingIcon = SOLID_BOOSTER

MODULE
{
	name = ModuleTurret
	
	yawTransformName = Rotate
	pitchTransformName = Pitch
	
	pitchSpeedDPS = 60
	yawSpeedDPS = 90
	
	minPitch = -15
	maxPitch = 85
	yawRange = 328.5
	
	smoothRotation = true
	smoothMultiplier = 10
	
	audioPath = BDArmory/Sounds/hydraulicLoop
	maxAudioPitch = 0.3
	minAudioPitch = 0.15
	maxVolume = 0.60
}
MODULE
{
	name = ModuleWeapon
	
	shortName = 20mm Oerlikon
	
	fireTransformName = fireTransform
	
	oneShotWorldParticles = true
	
	hasDeployAnim = false
	
	hasFireAnimation = false
	//fireAnimName = m1
	spinDownAnimation = false
	
	roundsPerMinute = 450
	maxDeviation = 1.0
	maxTargetingRange = 4000
	// BDArmory 1.13 removed airDetonation/airDetonationTiming/maxAirDetonationRange; the fuze comes from the BULLET definition. 20mmAPLong is solid AP (fuzeType None), so no detonation range is set.
	maxEffectiveDistance = 1500
	
	bulletType = 20mmAPLong
	ammoName = 20x102Ammo
	requestResourceAmount = 1
	BeltFed = false
	RoundsPerMag = 60
	ReloadTime = 8
	reloadAudioPath = BDArmory/Sounds/reload
	recoilReduction = 0.85
	
	//cannonShellPower = 8
	//cannonShellHeat = 14
	//cannonShellRadius = 11
	
	hasRecoil = true
	onlyFireInRange = false
	bulletDrop = true
	
	weaponType = ballistic	
	
	projectileColor = 255, 250, 0, 255
	
	tracerStartWidth = 0.12
	tracerEndWidth = 0.12
	tracerLength = 0
	tracerDeltaFactor = 2.75
	tracerInterval = 3
	tracerLuminance = 2
	
	maxHeat = 2400
	heatPerShot = 168
	heatLoss = 1200
	autoProxyTrackRange = 300
	
	engageAir = true
	engageMissile = false
	engageGround = true
	engageSLW = false
	
	fireSoundPath = BDArmory/Parts/50CalTurret/sounds/shot
	overheatSoundPath = BDArmory/Parts/50CalTurret/sounds/turretOverheat
	oneShotSound = true
	showReloadMeter = false
	reloadCompletePath = NAS/Sounds/reload_complete
	explModelPath = BDArmory/Models/explosion/explosion
	explSoundPath = BDArmory/Sounds/explode1
}
MODULE
{
	name = HitpointTracker
	ArmorThickness = 50
	maxHitPoints = 100000
}
RESOURCE
{
	name = 20x102Ammo
	amount = 600
	maxAmount = 600
}
MODULE
{
	name = NASCategoryModule
}
