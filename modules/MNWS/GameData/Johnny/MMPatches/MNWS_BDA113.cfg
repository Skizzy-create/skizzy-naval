// Agents.cfg points at a scaled logo that is not in the pack.
@AGENT[Modern?Navy?Pack]:AFTER[BDArmory]
{
	@logoScaledURL = Johnny/Agencies/MNP
}

// Resources/Jresource.cfg adds an FSCoolant scanner to the stock SurfaceScanner; FSCoolant
// only exists with Firespitter, so drop that scanner when Firespitter is not installed.
@PART[SurfaceScanner]:NEEDS[!Firespitter]:AFTER[BDArmory]
{
	!MODULE[ModuleResourceScanner]:HAS[#ResourceName[FSCoolant]] {}
}
