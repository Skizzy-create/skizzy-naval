// =====================================================================================
// MNWS_BDA113_Balance.cfg -- OPTIONAL balance pass for MNWS on BDArmory Plus 1.13.
// Delete this file to keep the author's original numbers (100-tonne warheads, 1,200 km
// missiles, 30,000 dmg/s lasers, invisible ECM). Runs in :LAST[BDArmory], after MNWS_BDA113.cfg.
// Reference points from BDArmory 1.13: AIM-120 25 kg, RBS-15 200 kg, Stingray 108 kg,
// AGM-86 1300 kg; BDA anti-ship ranges 40 km, torpedoes 8 km.
// =====================================================================================

// -------------------------------------------------------------------------------------
// Warheads (BDExplosivePart tntMass, kg), launch ranges and seeker ranges (m)
// Originals were 2,000-100,000 kg of TNT (instant kills on anything) and 15-2,000 km ranges.
// GBBM: each of its 9 cluster submunitions explodes with the full tntMass.
// -------------------------------------------------------------------------------------
@PART[AGM258]:HAS[@MODULE[BDExplosivePart]]:LAST[BDArmory]
{
	@MODULE[BDExplosivePart]
	{
		@tntMass = 450
	}
	@MODULE[MissileLauncher]
	{
		@maxStaticLaunchRange = 120000
		@activeRadarRange = 25000
	}
}

