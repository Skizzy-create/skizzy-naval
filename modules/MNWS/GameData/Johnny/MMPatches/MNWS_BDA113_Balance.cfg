// -------------------------------------------------------------------------------------
// Bullets: realistic HE fill (originals: 800 kg / 2000 kg of TNT in 80 kg / 200 kg slugs,
// 0.5 kg of TNT in a 0.2 kg 35 mm round). Values in line with BDA's 35x228 and 203 mm shells.
// -------------------------------------------------------------------------------------
@BULLET[208mmRailgun]:LAST[BDArmory]
{
	@tntMass = 25
}
@BULLET[428mmRailgun]:LAST[BDArmory]
{
	@tntMass = 80
}
@BULLET[35mmAAMS]:LAST[BDArmory]
{
	@bulletMass = 0.51
	@tntMass = 0.1
	@apBulletMod = 0.8
}

// -------------------------------------------------------------------------------------
// ECM: rcsReductionFactor = 0 makes a vessel completely invisible to radar whenever its jammer
// is on (radar missiles can never lock). 0.75 keeps a stealth bonus. Jets that already had a
// non-zero factor (0.2-0.7) are untouched.
// -------------------------------------------------------------------------------------
@PART[*]:HAS[#author[Johnny*],@MODULE[ModuleECMJammer]:HAS[#rcsReductionFactor[0]]]:LAST[BDArmory]
{
	@MODULE[ModuleECMJammer]:HAS[#rcsReductionFactor[0]]
	{
		@rcsReductionFactor = 0.75
	}
}

// -------------------------------------------------------------------------------------
// Lasers (laserDamage is damage per second). BDA's own lasers are ~1000.
// -------------------------------------------------------------------------------------
