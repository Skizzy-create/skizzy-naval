[[module]]
key = "HullBreach"
identifier = "SkizzyNaval-HullBreach"
strategy = "bundle"
enabled = true
pack = "depends"
name = "HullBreach (SkizzyNaval port)"
abstract = "Hull flooding, foundering and crush depth for BDArmory naval combat. Unofficial 1.8.0 port of HullBreach 1.7.0.5 to KSP 1.12.5 and BDArmory Plus 1.13."
description = """
Rewritten flood model: per-compartment flooding toward each part's waterline, severity from
BDArmory hit points and armour, submarine damage control, foundering, crush depth, one 10 Hz
vessel module instead of per-part updates. ModuleManager patches for Large Boat Parts, MNWS,
SACD, Kerbal Powers Naval, BDArmory, NAS, CVX and stock hulls (333 parts). Replaces the
original HullBreach (it provides and conflicts with it). Original by gomker, SpannerMonkey,
Gedas-S and zzhwudiaa, CC BY-NC-SA 3.0. Plugin source is in the repository.
"""
author = ["gomker", "SpannerMonkey", "Gedas-S", "zzhwudiaa", "Skizzy-create"]
license = "CC-BY-NC-SA-3.0"
tags = ["plugin", "physics", "parts", "combat"]
