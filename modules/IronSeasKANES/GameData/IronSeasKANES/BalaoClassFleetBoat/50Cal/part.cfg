// Modified in 2026-11 by the unofficial KSP 1.12.5 / BDArmory 1.13 update of Iron Seas KANES (see CHANGES.md). Original by SkunkWorksCommand, GPLv2.
// Needs NAS (NASCategoryModule, localisation) and BDArmory (bullet 12.7mmBullet, 50CalAmmo, sounds); MM drops this part if either is missing.
// Turret rig: this model.mu is one static mesh without Rotate/Pitch/fireTransform. ModuleRigTurret (IronSeasKANES/Plugins/SkizzyRig.dll) adds invisible SkizzyRig* yaw, pitch and fire transforms at load time, so BDArmory aims the gun and fires from its muzzle, but the mesh itself does not turn. See CHANGES.md.
PART:NEEDS[NAS,BDArmory]
{
// Kerbal Space Program - Part Config
// 
// 

// --- general parameters ---
name = 50CalGunBalaoClass
module = Part
author = SkunkWorks

// --- asset parameters ---
mesh = model.mu
rescaleFactor = 1

// --- node definitions ---
node_attach = 0.0, 0.0, 0.0, 0, -1, 0, 3
node_stack_bottom = 0.0, 0, 0, 0,1, 0, 3

// --- editor parameters ---
TechRequired = precisionEngineering
entryCost = 2100
cost = 2000
category = Utility
subcategory = 0
title = 50 Cal AA Gun Balao Class
manufacturer = #autoLOC_NAS_KerbinNavy_name //Kerbin Navy
description = Water-cooled .50 cal M2 Browning on a portable deck mount, used against aircraft and small craft. 500 rpm, BDArmory 12.7mmBullet (Raufoss, impact fuze) from 50CalAmmo. Effective to about 1.8 km.
// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
attachRules = 1,1,0,0,0

// --- standard part parameters ---
mass = 0.01
dragModelType = default
maximum_drag = 0.2
minimum_drag = 0.2
angularDrag = 2
crashTolerance = 1250
maxTemp = 3400

breakingForce = 5000
breakingTorque = 5000
buoyancy = -1
tags = nas bdarmory balao submarine sub gun turret navy naval 50 cal browning m2 machine gun anti aircraft aa us usn
stagingIcon = SOLID_BOOSTER

MODULE:NEEDS[SkizzyRig]
{
	name = ModuleRigTurret
	// SkizzyRig.dll (MIT, source in src/SkizzyRig) builds the turret transforms this model lacks.
	// The model is one merged mesh, so no mesh node is moved: the transforms are invisible and the gun mesh stays still.
	// Part frame, metres; up on the boat is -Z. Measured from the mesh vertices (see CHANGES.md).
	baseName = SkizzyRigBase
	yawName = SkizzyRigYaw
	pitchName = SkizzyRigPitch
	fireName = SkizzyRigFire
	upAxis = 0, 0, -1
	pivot = 0, 0, -0.026	// yaw axis through the pintle, at its top
	trunnion = 0, 0.0548, -0.1413	// centre of the round lug at the top of the cradle yoke
	boreDirection = 0, -1, 0	// barrel as modelled: level, toward -Y
	muzzles = 0, -0.6832, -0.1355	// muzzle tip, on the bore axis
}
MODULE
{
	name = ModuleTurret
	
	yawTransformName = SkizzyRigYaw
	pitchTransformName = SkizzyRigPitch
	baseTransformName = SkizzyRigBase
	
	pitchSpeedDPS = 60
	yawSpeedDPS = 90
	
	minPitch = -15
	maxPitch = 85
	yawRange = 328.5
	
	smoothRotation = true
	smoothMultiplier = 10
	
	audioPath = BDArmory/Sounds/hydraulicLoop
	maxAudioPitch = 0.3
	minAudioPitch = 0.15
	maxVolume = 0.60
}
MODULE
{
	name = ModuleWeapon
	
	shortName = .50 cal M2 Browning
	
	fireTransformName = SkizzyRigFire
	
	oneShotWorldParticles = true
	
	hasDeployAnim = false
	
	hasFireAnimation = false
	//fireAnimName = m1
	spinDownAnimation = false
	
	roundsPerMinute = 500
	maxDeviation = 0.4
	maxTargetingRange = 3000
	// BDArmory 1.13 removed airDetonation/airDetonationTiming/maxAirDetonationRange; the fuze comes from the BULLET definition. 12.7mmBullet bursts on impact, so no detonation range is set.
	maxEffectiveDistance = 1800
	
	bulletType = 12.7mmBullet
	ammoName = 50CalAmmo
	requestResourceAmount = 1
	recoilReduction = 0.85
	
	//cannonShellPower = 8
	//cannonShellHeat = 14
	//cannonShellRadius = 11
	
	hasRecoil = true
	onlyFireInRange = false
	bulletDrop = true
	
	weaponType = ballistic	
	
	projectileColor = 255, 250, 0, 255
	
	tracerStartWidth = 0.1
	tracerEndWidth = 0.1
	tracerLength = 0
	tracerDeltaFactor = 2.75
	tracerInterval = 5
	tracerLuminance = 2
	
	maxHeat = 3600
	heatPerShot = 100
	heatLoss = 1000
	autoProxyTrackRange = 300
	
	engageAir = true
	engageMissile = false
	engageGround = true
	engageSLW = false
	
	fireSoundPath = BDArmory/Parts/50CalTurret/sounds/shot
	overheatSoundPath = BDArmory/Parts/50CalTurret/sounds/turretOverheat
	oneShotSound = true
	showReloadMeter = false
	reloadCompletePath = NAS/Sounds/reload_complete
	explModelPath = BDArmory/Models/explosion/30mmExplosion
	explSoundPath = BDArmory/Sounds/subExplode
}
MODULE
{
	name = HitpointTracker
	ArmorThickness = 50
	maxHitPoints = 100000
}
RESOURCE
{
	name = 50CalAmmo
	amount = 1000
	maxAmount = 1000
}
MODULE
{
	name = NASCategoryModule
}
}