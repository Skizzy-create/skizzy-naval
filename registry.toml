abstract = "SkunkWorksCommand's WWII Balao-class submarine updated for KSP 1.12.5, BDArmory Plus 1.13 and NAS: working, realistic deck guns, crush depth and dependency fallbacks."
description = """
Iron Seas KANES FIGHTING SHIPS 1 (1.0.0.1) regrouped under GameData/IronSeasKANES. The six
deck guns get BDArmory 1.13 keys and real 20 mm Oerlikon, .50 M2, 40 mm Bofors and 4"/50
