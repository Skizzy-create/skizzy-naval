		%maxLocks = 4
		%multiLockFOV = 30
		%lockAttemptFOV = 2
		%scanRotationSpeed = 120
		%lockRotationSpeed = 120
		%canReceiveRadarData = true
		@radarDetectionCurve
		{
			!key,* = delete
			key = 0 0
			key = 3 0
			key = 11 10
			key = 20 55
			key = 40 150
		}
		@radarLockTrackCurve
		{
			!key,* = delete
			key = 0 0
			key = 3 5
			key = 11 20
			key = 20 75
			key = 40 200
		}
	}
}

// Mass clamp. Buoyancy force, linear water drag and angular water drag in KSP do not depend on
// part mass, so buoyancy, engine thrust and reaction-wheel torque are scaled by the same factor
// as mass: draft, acceleration and turn rate stay as the author tuned them, while top speed
// drops by sqrt(factor) (the originals were far too fast; the AI caps speed anyway).
// Hitpoints are set explicitly (BDA uses an explicit maxHitPoints literally). Armour is
// Mild Steel; armorVolume (normally the bounding-box surface area, ~20,000 m2 on these hulls)
// is set to the area that keeps the armour at ~10 % of the ship's mass, and the hull mass is
// reduced by the same amount so the total matches the target. With the old armour type (None)
// BDA 1.13 forces armour to 10 mm, so the original 800-1800 mm values never applied.

// FDG057: 6000 t -> 1200 t total (scale 1/5); hull 1080.7 t + 119.3 t Mild Steel armour (20 mm x 760 m2)
@PART[FDG057]:HAS[@MODULE[MissileFire]]:AFTER[BDArmory]
{
	@mass = 1080.7
	@buoyancy = 0.15
	@MODULE[ModuleEnginesFX],*
	{
		@maxThrust = 5000
	}
	@MODULE[ModuleReactionWheel],*
	{
		@PitchTorque = 4000000
		@YawTorque = 4000000
		@RollTorque = 2000000
	}
	@MODULE[HitpointTracker]
	{
		%maxHitPoints = 40000
		%ArmorThickness = 20
		%SelectedArmorType = Mild Steel
		%armorVolume = 760
	}
}

