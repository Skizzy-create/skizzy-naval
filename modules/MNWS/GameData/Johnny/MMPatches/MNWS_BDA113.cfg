// =====================================================================================
// MNWS_BDA113.cfg -- Modern Naval Weapons Systems (MNWS 2.4, "Johnny") compatibility patch
// for KSP 1.12.5 + BDArmory Plus 1.13.x (BrettRyland fork) + ModuleManager 4.x.
//
// This file only contains compatibility / correctness fixes. Optional balance changes
// (warheads, missile ranges, ECM, lasers, sub-part HP) live in MNWS_BDA113_Balance.cfg.
// All patches run in :AFTER[BDArmory], i.e. after BDArmory's own HitpointTracker patch.
// Patches marked :NEEDS[MNWSFix] use the small plugin shipped in Johnny/Plugins/MNWSFix.dll
// (AVLS VLS variants, "In Cargo Bay" / custom-bay flagging); everything else is plain MM.
// See CHANGES.md next to the GameData folder for the full list and the reasoning.
// =====================================================================================

// -------------------------------------------------------------------------------------
// 1. Modules from plugins that do not exist for KSP 1.12 / BDA 1.13
// -------------------------------------------------------------------------------------

// MNWSCategoryModule: the MNWS category plugin is not shipped. BDA 1.13 auto-categorises
// weapons itself (AUTOCATEGORIZE_PARTS), so the module is simply removed.
@PART[*]:HAS[#author[Johnny*],@MODULE[MNWSCategoryModule]]:AFTER[BDArmory]
{
	!MODULE[MNWSCategoryModule],* {}
}

// BDACategoryModule was removed from BDArmory years ago (H20AR rotary rail).
@PART[*]:HAS[#author[Johnny*],@MODULE[BDACategoryModule]]:AFTER[BDArmory]
{
	!MODULE[BDACategoryModule],* {}
}

// BurnTogether (formation-throttle plugin) -- only removed when that plugin is absent.
@PART[*]:HAS[#author[Johnny*],@MODULE[BurnTogether]]:NEEDS[!BurnTogether]:AFTER[BDArmory]
{
	!MODULE[BurnTogether],* {}
}

// ModuleAileron: no plugin in the KSP 1.12 ecosystem provides it, so it never loaded.
// The 12 jets that also carry a stock ModuleControlSurface keep that (the stock
// equivalent); the others steer with their reaction wheels exactly as before.
@PART[*]:HAS[#author[Johnny*],@MODULE[ModuleAileron]]:AFTER[BDArmory]
{
	!MODULE[ModuleAileron],* {}
}

// Aircraft Carrier Accessories (KFC/Plugins/ACA.dll): Tailhook, ReloadableRail, FuelNozzle, FuelCap.
// Kept when ACA is installed; stripped only when neither the ACA assembly nor the KFC folder exists.
@PART[*]:HAS[#author[Johnny*]]:NEEDS[!ACA&!KFC]:AFTER[BDArmory]
{
	!MODULE[Tailhook],* {}
	!MODULE[ReloadableRail],* {}
	!MODULE[FuelNozzle],* {}
	!MODULE[FuelCap],* {}
}
// With ACA installed: "wiretension = 15f" is C# source syntax, not a number KSP can parse.
@PART[*]:HAS[#author[Johnny*],@MODULE[Tailhook]]:NEEDS[ACA|KFC]:AFTER[BDArmory]
{
	@MODULE[Tailhook],*
	{
		@wiretension = 15
	}
}

// -------------------------------------------------------------------------------------
// 2. Renamed / removed BDArmory modules and keys
// -------------------------------------------------------------------------------------

// RocketLauncher was removed from BDArmory. Rocket pods are now a ModuleWeapon with
// weaponType = rocket + rocketPod = true, exactly like BDA's own S-8 pod. The R276 model
// already has the "rockets" transform with rocket_1..rocket_184 children that this needs.
@PART[R276?Launcher]:HAS[@MODULE[RocketLauncher]]:AFTER[BDArmory]
{
	!MODULE[RocketLauncher],* {}
	MODULE
	{
		name = ModuleWeapon
		shortName = R276
		fireTransformName = rockets
		hasDeployAnim = false
		hasFireAnimation = false
		roundsPerMinute = 1600
		maxEffectiveDistance = 4000
		maxTargetingRange = 5000
		weaponType = rocket
		bulletType = 8KOMS; 8DMS
		ammoName = S-8KOMRocket
		requestResourceAmount = 1
		rocketPod = true
		externalAmmo = false
		onlyFireInRange = true
		autoProxyTrackRange = 1200
		fireSoundPath = BDArmory/Sounds/launch
		oneShotSound = true
		explModelPath = BDArmory/Models/explosion/explosion
		explSoundPath = BDArmory/Sounds/explode1
	}
}

// ModuleWeapon airDetonation / airDetonationTiming no longer exist; fuzing now lives in the
// BULLET definition (35mmAAMS gets fuzeType = Flak below).
@PART[AAMS|AAMSR|NH80GUN]:HAS[@MODULE[ModuleWeapon]]:AFTER[BDArmory]
{
	@MODULE[ModuleWeapon],*
	{
		!airDetonation = delete
		!airDetonationTiming = delete
	}
}

// ModuleTargetingCamera has no shortName field.
@PART[AAMS|AAMSL|AAMSLM|AAMSR|FRADAR]:HAS[@MODULE[ModuleTargetingCamera]]:AFTER[BDArmory]
{
	@MODULE[ModuleTargetingCamera],*
	{
		!shortName = delete
	}
}

// MissileLauncher.terminalManeuvering was replaced by the Cruise pop-up attack (CruisePopup).
@PART[AGM258|AGM2588|AGM46|GBBM]:HAS[@MODULE[MissileLauncher]]:AFTER[BDArmory]
{
	@MODULE[MissileLauncher]
	{
		!terminalManeuvering = delete
		%CruisePopup = true
	}
}
// On non-cruise missiles terminalManeuvering never did anything; just drop it.
@PART[HHQ16C|HHQ19|HHQ19RCS]:HAS[@MODULE[MissileLauncher]]:AFTER[BDArmory]
{
	@MODULE[MissileLauncher]
	{
		!terminalManeuvering = delete
	}
}

// Torpedoes: BDA 1.13 uses homingType = SLW for underwater weapons (same as BDA's Stingray).
// isTubeLoaded and terminalGuidanceActive no longer exist; the radar->radar terminal
// guidance entries were a no-op (same seeker as the main one) and are removed.
@PART[MK48?Torpedo|MK56?Torpedo|MK58?Torpedo]:HAS[@MODULE[MissileLauncher]]:AFTER[BDArmory]
{
	@MODULE[MissileLauncher]
	{
		@homingType = SLW
		!isTubeLoaded = delete
		!terminalGuidanceActive = delete
		!terminalGuidanceType = delete
		!terminalGuidanceDistance = delete
		%engageAir = false
		%engageMissile = false
		%engageGround = true
		%engageSLW = true
	}
}
@PART[ASMM]:HAS[@MODULE[MissileLauncher]]:AFTER[BDArmory]
{
	@MODULE[MissileLauncher]
	{
		@homingType = SLW
		%engageAir = false
		%engageMissile = false
		%engageGround = true
		%engageSLW = true
	}
}

// -------------------------------------------------------------------------------------
// 3. Bullet definitions (BulletDefs/Johnny_Bullets.cfg)
// -------------------------------------------------------------------------------------

// The pack ships a second BULLET "def". BDA only reads its default bullet from BD_Bullets.cfg
// and logs an error for the duplicate, so the pack's copy (identified by its legacy
// blastPower key, which BDA's own def does not have) is deleted.
!BULLET[def]:HAS[#blastPower[*]]:AFTER[BDArmory] {}

// Legacy blast keys are gone; explosive must be Standard/Shaped (tntMass > 0 makes it explode);
// every field BDA 1.13 parses is supplied so no "using default value" warnings are logged.
@BULLET[208mmRailgun|428mmRailgun|35mmAAMS]:AFTER[BDArmory]
{
	!blastPower = delete
	!blastHeat = delete
	!blastRadius = delete
	@explosive = Standard
	%incendiary = False
	%projectileCount = 1
	%guidanceRange = -1
	%bulletDragTypeName = AnalyticEstimate
	%fadeColor = False
}
@BULLET[208mmRailgun]:AFTER[BDArmory]
{
	%DisplayName = 208mm Railgun Slug
	%fuzeType = Impact
	%projectileColor = 255, 90, 0, 190
	%startColor = 255, 105, 0, 128
}
@BULLET[428mmRailgun]:AFTER[BDArmory]
{
	%DisplayName = 428mm Railgun Slug
	%fuzeType = Impact
	%projectileColor = 255, 90, 0, 190
	%startColor = 255, 105, 0, 128
}
// Was airDetonation = true / airDetonationTiming = false on the guns (proximity air burst).
// Flak = proximity fuze + automatic time fuze, the closest 1.13 equivalent for a CIWS round.
// (Literal mapping would be Proximity; change to Proximity if you prefer.)
@BULLET[35mmAAMS]:AFTER[BDArmory]
{
	%DisplayName = 35mm AAMS Air-Burst
	%fuzeType = Flak
	%projectileColor = 255, 90, 0, 128
	%startColor = 255, 105, 0, 70
}

// -------------------------------------------------------------------------------------
// 4. AVLS11 / AVLS22 / AVLS33 missile cells
// -------------------------------------------------------------------------------------
// 4a. AVLS11V / AVLS22V / AVLS33V: real BDArmory vertical launchers (needs Plugins/MNWSFix.dll).
// Copies of the cells set up like BDArmory's own VLS (bahaVLSQuad): MissileLauncher missileType =
// launcher + MultiMissileLauncher + ModuleMissileRearm. One missile type per block, spawned in the
// cells, fired straight up in salvoes; the launcher plays the door animation "AVLS" before each
// salvo and closes the doors afterwards. The models have no launch transforms, so the plugin's
// ModuleInjectTransforms creates "mnwsVLS" with children missile1..missileN (one per cell, +Z = up)
// on the part prefab while KSP compiles the part, before any BDArmory code looks them up.
// Cell centres are the centres of the square cells in the floor mesh of each .mu (y = floor top,
// +2 cm clearance), derived by mnws_vls.py; alignMissileTail lifts each spawn point so the loaded
// missile's tail (its "bottom" stack node) sits on the floor. The original parts stay racks (4b),
// so existing craft are unaffected. The copies are made before 4b, so they have no cargo bay.
// AVLS11V: 8 cells, 0.90 m square, 8.05 m from the floor (y = 1) to the doors.
+PART[AVLS11]:NEEDS[MNWSFix]:AFTER[BDArmory]
{
	@name = AVLS11V
	@title = AVLS11 VLS (8 cells, BDArmory launcher)
	%bdacategory = Missile turrets
	@description = AVLS11 rigged as a BDArmory vertical launch system. In the editor attach one missile to any cell node: all 8 cells are loaded with that missile type and the attached part is removed. The weapon manager opens the cell doors, fires straight up and closes the doors again. Missiles must fit a cell (0.90 m wide, 8.1 m deep). Needs MNWSFix.dll.
	!MODULE[ModuleAnimateGeneric]:HAS[#animationName[AVLS]] {}
	!MODULE[ModuleCargoBay],* {}
	MODULE
	{
		name = ModuleInjectTransforms
		groupName = mnwsVLS
		groupPosition = 0, 0, 0
		groupRotation = -90, 0, 0
		childPrefix = missile
		firstIndex = 1
		count = 8
		alignMissileTail = true
		positions = -0.8396, 1.02, -1.5901; 0.8207, 1.02, -1.5901; -0.8396, 1.02, -0.5249; 0.8207, 1.02, -0.5249; -0.8396, 1.02, 0.5297; 0.8207, 1.02, 0.5297; -0.8396, 1.02, 1.5949; 0.8207, 1.02, 1.5949
	}
	MODULE
	{
		name = MissileLauncher
		missileType = launcher
	}
	MODULE
	{
		name = MultiMissileLauncher
		launchTransformName = mnwsVLS
		deployAnimationName = AVLS
		deploySpeed = 1
		deployTime = 1.5
		subMunitionName =
		subMunitionPath =
		salvoSize = 1
		setSalvoSize = true
		isMultiLauncher = true
		overrideReferenceTransform = true
		RailNode = missile
		rippleRPM = 120
		tntMass = 25
		permitJettison = false
		OverrideDropSettings = true
		ignoreLauncherColliders = true
		adjustMissileVOffset = false
	}
	MODULE
	{
		name = ModuleMissileRearm
		reloadTime = 30
		AccountForAmmo = true
		MissileName =
		railAmmo = 8
		maxAmmo = 8
	}
}
