	@MODULE[ModuleEnginesFX],*
	{
		@maxThrust = 400000
	}
	@MODULE[ModuleReactionWheel],*
	{
		@PitchTorque = 8000000
		@YawTorque = 8000000
		@RollTorque = 8000000
	}
	@MODULE[HitpointTracker]
	{
		%maxHitPoints = 100000
		%ArmorThickness = 50
		%SelectedArmorType = Mild Steel
		%armorVolume = 2610
	}
}

// AMB: 400 t -> 400 t total (scale 1/1); hull 360.0 t + 40.0 t Mild Steel armour (15 mm x 340 m2)
@PART[AMB]:HAS[@MODULE[MissileFire]]:AFTER[BDArmory]
{
	@mass = 360.0
	@MODULE[HitpointTracker]
	{
		%maxHitPoints = 20000
		%ArmorThickness = 15
		%SelectedArmorType = Mild Steel
		%armorVolume = 340
	}
}

// AMBII: 400 t -> 400 t total (scale 1/1); hull 360.0 t + 40.0 t Mild Steel armour (15 mm x 340 m2)
@PART[AMBII]:HAS[@MODULE[MissileFire]]:AFTER[BDArmory]
{
	@mass = 360.0
	@MODULE[HitpointTracker]
	{
		%maxHitPoints = 20000
		%ArmorThickness = 15
		%SelectedArmorType = Mild Steel
		%armorVolume = 340
	}
}

// Ship-mounted equipment gets the same 1/5 factor as the hulls. Otherwise a 520 t RGBB turret or
// eight 50 t AVLS blocks would weigh five times more relative to the (now lighter) hull than the
// author intended, and a fully fitted ship would ride far lower or sink. Missiles, aircraft, the
// 3X truck and its 5 t turrets are unchanged.
@PART[AAMS|AAMSL|AAMSLM|AAMSR|FRADAR|HHQXL|HHQXL2|HHQXX|SAAM|YUXX|MK58L|RML|LLauncher|AS_ML|AVLS11|AVLS22|AVLS33|AVLS11V|AVLS22V|AVLS33V|AVLSX1|AVLSX2|AVLSX3|MissleCell2050|DDG2002?RAIL|RGBB|MSWSWT|MSWSWT1|MSWSWT2|MSWSWT3|MSWSWT4|MSWSM4X]:HAS[#author[Johnny*]]:AFTER[BDArmory]
{
	@mass *= 0.2
}

