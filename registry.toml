and muzzle transforms at load time: the guns aim and fire from their muzzles, but the gun
meshes do not turn. The hull and sail collapse at about 224 m, the boat spawns surfaced, and
ModuleManager fallbacks remove WildBlueTools, KerbalActuators, BonVoyage and Firespitter
modules when those mods are missing (Kerbal Powers Naval ballast is used if present). Remove
an old GameData/BalaoClassFleetBoat and GameData/4BladeFastScrew first. Original by
SkunkWorksCommand, GPLv2.
"""
author = ["SkunkWorksCommand", "Skizzy-create"]
license = ["GPL-2.0", "MIT"]       # MIT: the SkizzyRig plugin (src/SkizzyRig)
tags = ["parts", "plugin", "combat"]
depends = ["ModuleManager"]
recommends = ["SkizzyNaval-NAS", "@bdarmory", "WildBlueTools", "CommunityResourcePack", "FirespitterCore"]
suggests = ["SubTrim", "KerbalPowersNaval", "BonVoyage", "Buffalo", "SkizzyNaval-HullBreach"]
install = [{ file = "GameData/IronSeasKANES", install_to = "GameData" }]
resources = { x_upstream = "https://spacedock.info/mod/2528/Iron%20Seas%20KANES%20FIGHTING%20SHIPS%201" }

